  for(let k=0;k<a.tiles.length;k++){const i=a.tiles[k];if(!Number.isInteger(i)||i<0||i>=W*H||!terr[i]||!(a.d[k]>=1))return}

function onMsg(ev,p){

 if(net.role==='host'){
  if(ev==='hello'){const id=String(p.id||'').slice(0,16);if(!id||id===myId)return;let pl=net.players.find(x=>x.id===id),add=false;
   if(!pl){if(net.started||net.players.length>=3){sendLobby();return}pl={id,n:cleanName(p.n),f:cleanFlag(p.f)};net.players.push(pl);add=true}
   pl.seen=performance.now();
   if(net.started&&net.roster&&net.roster.some(r=>r.id===id)&&p.have!==net.gid)netSend('start',startMsg());
   if(add){sendLobby();if(!$('#menu').hidden)menuView('lobby')}}

  else if(ev==='bye'&&!net.started){const n=net.players.length;net.players=net.players.filter(x=>x.id!==p.id);if(net.players.length!==n){sendLobby();if(!$('#menu').hidden)menuView('lobby')}}
